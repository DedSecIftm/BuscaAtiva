spring.application.name=buscaativa

# Sobe um PostgreSQL temporário no Docker, separado do banco de desenvolvimento, na mesma imagem do docker-compose.
# TC_DAEMON mantém o container entre os contextos do Spring; ele é removido ao fim dos testes.
spring.datasource.url=jdbc:tc:postgresql:18-alpine:///buscaativa?TC_DAEMON=true
spring.datasource.driver-class-name=org.testcontainers.jdbc.ContainerDatabaseDriver

# Cria e atualiza as tabelas a partir das entidades. Antes do deploy, trocar por migrações (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

