spring.application.name=buscaativa

# Os valores padrão apontam para o banco do docker-compose acessado pela máquina local (porta 5433).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/buscaativa}
spring.datasource.username=${DB_USERNAME:buscaativa}
spring.datasource.password=${DB_PASSWORD:buscaativa}

# Cria e atualiza as tabelas a partir das entidades. Antes do deploy, trocar por migrações (Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

chave.secret-key=${SECRET_KEY}

# Validade do token JWT (formato ISO-8601: PT4H = 4 horas).
jwt.expiracao=${JWT_EXPIRACAO:PT4H}

# Primeiro administrador, criado na subida se ainda não existir. Deixe vazio para não criar.
admin.email=${ADMIN_EMAIL:}
admin.senha=${ADMIN_SENHA:}
